name: Build Frillion question packs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: write

concurrency:
  group: build-packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build packs from Wikidata
        env:
          WD_CONTACT: https://github.com/${{ github.repository }}
        run: node build-packs.mjs --html index.html --out packs --delay 2000 --max-minutes 300
      - name: Commit updated packs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add packs
          if git diff --cached --quiet; then
            echo "No pack changes."
          else
            git commit -m "Update question packs ($(date -u +%Y-%m-%d))"
            git push
          fi
